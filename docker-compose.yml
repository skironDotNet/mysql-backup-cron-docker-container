services:
  mysql-backup:
    build: ./src
    image: mysql-backup-cron
    init: true
    restart: unless-stopped
    environment:
      SCHEDULE_EXPR: "0 3 * * *"
      TZ: America/Chicago
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_BACKUP_PASSWORD:?Set MYSQL_BACKUP_PASSWORD in .env}
      BACKUP_DIR: /backups
    volumes:
      - /srv/backups/mysql:/backups
    networks:
      - mysql-network

networks:
  mysql-network:
    external: true
